<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Demo — GameFramework</title>
  <style>

    html, body { width: 100%; height: 100%; overflow: hidden; background: #16161e; }
    #gf-container {
