<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shining Quest – GameFramework</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050510;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }

    #gameContainer {
      position: relative;
      width: 832px;
      height: 480px;
    }

    #gameCanvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid rgba(136, 170, 255, 0.4);
      box-shadow: 0 0 40px rgba(80, 120, 220, 0.4),
                  inset 0 0 20px rgba(0,0,0,0.85);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="832" height="480"></canvas>
  </div>

  <!-- Game config -->
  <script src="config.js"></script>

  <!-- GameFramework bundle -->
  <script src="../../framework/GameFramework.bundle.js"></script>

  <!-- Framework character sprites (claude / claudia) -->
  <script src="../../framework/sprites/claude.js"></script>
  <script src="../../framework/sprites/claudia.js"></script>

  <!-- Game-specific sprites and data -->
  <script src="sprites/monsters.js"></script>
  <script src="sprites/portraits.js"></script>
  <script src="data/gameData.js"></script>

  <!-- Game logic -->
  <script src="ShiningQuestGame.js"></script>
</body>
</html>
