<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Invaders – GameFramework</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 500px;
    }

    #gameCanvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 40px rgba(0, 180, 255, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <!-- ── Game config ──────────────────────────────────────────────────── -->
  <script src="config.js"></script>

  <!-- ── GameFramework ─────────────────────────────────────────────────── -->
  <script src="../../framework/GameFramework.bundle.js"></script>

  <!-- ── Sprites ───────────────────────────────────────────────────── -->
  <script src="sprites/aliens.js"></script>
  <script src="sprites/player.js"></script>
  <script src="sprites/boss.js"></script>

  <!-- ── Game logic ────────────────────────────────────────────────── -->
  <script src="OrnithStormGame.js"></script>
</body>
</html>
